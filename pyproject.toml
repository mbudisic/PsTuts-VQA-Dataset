[project]
name = "pstuts-vqa-tools"
version = "0.1.0"
description = "Tools for processing and analyzing the Photoshop Tutorials Video QA Dataset"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "typing-extensions>=4.0.0",
    "tqdm",
    "tesserocr>=2.8.0",
    "easyocr>=1.7.2",
    "fiftyone>=1.5.0",
    "ipykernel>=6.29.5",
    "pip>=25.0.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.7",
    "ffmpeg>=1.4",
    "langchain>=0.3.25",
    "langchain-qdrant>=0.2.0",
    "langchain-openai>=0.3.16",
    "dotenv>=0.9.9",
    "tavily-python>=0.7.2",
    "ragas>=0.2.15",
    "langchain-community>=0.3.23",
    "unstructured>=0.17.2",
    "langgraph>=0.4.3",
    "jq>=1.8.0",
    "langchain-experimental>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.isort]
known-first-party = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
